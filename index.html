<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- VUE CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <title>Curso vue3</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
  <div id="app">
    <div class="cart"></div>

  </div>






    <div id="app">
      <div class="product-display">
        <div class="product-container">
          <div class="product-image">
            <img src='./assets/images/t-shirt-blue.png' alt=”img-product”>
          </div>
          <div class="product-info">
            <h1>{{product_title}}</h1>
            <p v-if="isStock > 10 && isStock < 999">In Stock</p>
            <p v-else-if="isStock <= 10 && isStock >= 1 ">Quaseacabando</p>
            <p v-else-if="isStock > 1000">brr brr batapim</p>
            <p v-else> Mundial do palmeiras</p>
          </div>
          
        </div>
      </div>
    </div>

    <script>
      const { createApp, ref } = Vue;

      createApp({
        setup() {
          return {
            product_title: ref('T-shirt'),
            image: ref ("assets/images/t-shirt-blue.png"),
            isStock: ref(10000)
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
